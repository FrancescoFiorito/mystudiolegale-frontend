name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm install

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: eas build --platform ios --profile production --local --non-interactive --output build.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mystudiolegale-ios
          path: build.ipa

      - name: Prepare App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cat <<'EOF' > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          EOF

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build.ipa \
            --apiKey ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}