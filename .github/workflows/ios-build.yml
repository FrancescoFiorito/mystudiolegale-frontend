name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm install

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

            - run: eas build --platform ios --profile production --local --non-interactive --output build.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mystudiolegale-ios
          path: build.ipa